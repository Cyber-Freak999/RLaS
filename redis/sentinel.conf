port 26379
dir /data

# Monitor by static IP, not hostname: a stopped container's DNS name stops
# resolving, which blocks Sentinel's failover path. The compose network pins
# these addresses (see docker-compose.yml), so they are stable across
# stop/start and even container recreation.
sentinel monitor mymaster 172.28.0.10 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 20000
sentinel parallel-syncs mymaster 1
