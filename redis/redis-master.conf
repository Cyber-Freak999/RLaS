port 6379
dir /data

# AOF durability on the primary. client_limits and api_keys are the only copy
# of who's allowed to call the system, so losing them deprovisions everyone;
# GCRA state itself is fine to lose (it just resets to a fresh bucket).
appendonly yes
appendfsync everysec

# Prefer this node on failover. Sentinel promotes the replica with the lowest
# replica-priority (0 = never), and this host is the static primary the whole
# topology is built around, so it should win every election it can join. The
# chaos gate (k6/chaos-runner.sh) relies on this to flip the topology back to
# redis-master as primary after each master-only outage test.
replica-priority 1
