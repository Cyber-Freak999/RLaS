# Load balancer in front of the 3 rate-limiter replicas.
#
# Routing decisions:
#   * Round-robin across all replicas, no sticky sessions (arch doc §5). The
#     same shared Redis GCRA state makes correctness independent of which
#     replica serves a request.
#   * 429 responses are never treated as upstream failures. proxy_next_upstream
#     defaults to error/timeout/invalid_header/http_500/502/503/504 — 4xx is
#     already excluded, and that must stay that way: a saturated bucket is the
#     intended answer, not a trigger to yank the replica out of rotation.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # The Docker embedded DNS. rate-limiter is a scaled compose service whose
    # containers come and go; without `resolve` nginx would resolve the name
    # once at startup and never learn late/restarted replicas, silently
    # blackholing them (max_fails would eventually catch failures, but the
    # initial window looks like a broken spread).
    resolver 127.0.0.11 ipv6=off;

    upstream rate_limiters {
        # `zone` is required for runtime resolution (`resolve`) — nginx refuses
        # to re-resolve an upstream that isn't in shared memory.
        zone rate_limiters 64k;
        server rate-limiter:8080 resolve;
        # Connection pooling: HTTP/1.1 with an empty Connection header keeps
        # the same upstream connection alive across proxied requests. Without
        # the pool, every client request opens a fresh TCP+TLS handshake.
        keepalive 32;
        # Passive health checks: drop a replica after 3 failed requests and
        # retry after 10s. 4xx (incl. 429) never counts as a failure (above).
    }

    server {
        listen 80;

        # Dependency-agnostic liveness for compose's service_healthy gate on
        # nginx itself.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://rate_limiters;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass X-Replica from the upstream through to the caller unchanged.
        }
    }
}
