# Provisioned data sources. UIDs are pinned so dashboards reference stable
# ids. Endpoints and credentials come from the container environment (Grafana
# interpolates ${VAR} in provisioning files): compose supplies the in-network
# defaults in docker-compose.yml, and a managed deployment (Render) overrides
# them with its own hosts and credentials.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: rlas-prometheus-ds
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false

  - name: TimescaleDB
    uid: rlas-timescale-ds
    # Grafana 13 datasource type == plugin id (postgres was split out of core;
    # the legacy `postgresql` type no longer resolves to the plugin).
    type: grafana-postgresql-datasource
    access: proxy
    url: ${TIMESCALE_DB_HOST}:5432
    user: ${TIMESCALE_DB_USER}
    secureJsonData:
      password: ${TIMESCALE_DB_PASSWORD}
    jsonData:
      database: ${TIMESCALE_DB_NAME}
      sslmode: ${TIMESCALE_DB_SSLMODE}
      postgresVersion: 1600
    editable: false
