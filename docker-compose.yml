name: rlas

# Core services only. The k6 test overlay lives in docker-compose.test.yml so
# starting the system and testing it stay two separate steps (see README §3).

services:
  redis-master:
    image: redis:7-alpine
    command: ["sh", "/usr/local/etc/redis/entrypoint.sh", "master", "/usr/local/etc/redis/redis-master.conf", "redis-server"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./redis/entrypoint.sh:/usr/local/etc/redis/entrypoint.sh:ro
      - ./redis/redis-master.conf:/usr/local/etc/redis/redis-master.conf:ro
      - redis-master-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.28.0.10

  redis-replica:
    image: redis:7-alpine
    command: ["sh", "/usr/local/etc/redis/entrypoint.sh", "replica", "/usr/local/etc/redis/redis-replica.conf", "redis-server"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./redis/entrypoint.sh:/usr/local/etc/redis/entrypoint.sh:ro
      - ./redis/redis-replica.conf:/usr/local/etc/redis/redis-replica.conf:ro
      - redis-replica-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.28.0.11

  redis-sentinel-1:
    image: redis:7-alpine
    command: ["sh", "/usr/local/etc/redis/entrypoint.sh", "sentinel", "/usr/local/etc/redis/sentinel.conf", "redis-sentinel"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./redis/entrypoint.sh:/usr/local/etc/redis/entrypoint.sh:ro
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
      - redis-sentinel-1-data:/data
    ports:
      - "127.0.0.1:26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -p 26379 -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping; else redis-cli -p 26379 ping; fi | grep -q PONG"]
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.28.0.20

  redis-sentinel-2:
    image: redis:7-alpine
    command: ["sh", "/usr/local/etc/redis/entrypoint.sh", "sentinel", "/usr/local/etc/redis/sentinel.conf", "redis-sentinel"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./redis/entrypoint.sh:/usr/local/etc/redis/entrypoint.sh:ro
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
      - redis-sentinel-2-data:/data
    ports:
      - "127.0.0.1:26380:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -p 26379 -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping; else redis-cli -p 26379 ping; fi | grep -q PONG"]
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.28.0.21

  redis-sentinel-3:
    image: redis:7-alpine
    command: ["sh", "/usr/local/etc/redis/entrypoint.sh", "sentinel", "/usr/local/etc/redis/sentinel.conf", "redis-sentinel"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./redis/entrypoint.sh:/usr/local/etc/redis/entrypoint.sh:ro
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
      - redis-sentinel-3-data:/data
    ports:
      - "127.0.0.1:26381:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -p 26379 -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping; else redis-cli -p 26379 ping; fi | grep -q PONG"]
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.28.0.22

  rate-limiter:
    build:
      context: .
      dockerfile: rate-limiter/Dockerfile
    environment:
      REDIS_SENTINEL_ADDRS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    healthcheck:
      # Hits the real dependency-aware /healthz (constraint 11): Redis down =>
      # 503 => compose marks the container unhealthy, not a fake liveness check.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timescale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timescale}
      POSTGRES_DB: ${POSTGRES_DB:-rlas}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready gates control-plane startup so the schema never races the
      # database coming up (depends_on: service_healthy, constraint 11).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timescale} -d ${POSTGRES_DB:-rlas}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      # Required: compose fails fast if ADMIN_BEARER_TOKEN is unset rather than
      # booting an admin API with no auth (constraint 8).
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:?ADMIN_BEARER_TOKEN must be set in .env}
      # Single DSN derived from the TimescaleDB container credentials so the
      # compose wiring has exactly one source of truth for the analytics DB.
      TIMESCALE_DSN: postgres://${POSTGRES_USER:-timescale}:${POSTGRES_PASSWORD:-timescale}@timescaledb:5432/${POSTGRES_DB:-rlas}?sslmode=disable
      REDIS_SENTINEL_ADDRS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      # Real dependency-aware /healthz (constraint 11): Redis or TimescaleDB
      # down => 503 => compose marks the container unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-master-data:
  redis-replica-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:
  timescale-data:
