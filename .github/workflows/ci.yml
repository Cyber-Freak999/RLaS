# Small PR workflow (AGENTS.md "CI policy"): go vet + go test -race for both
# modules. The heavy compose + k6 suite stays a local/release gate. The job
# name is deliberately a single "build-and-test" so it maps 1:1 onto the
# required status check wired into the main branch protection rule.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: redis/go.mod
          cache: true

      - name: vet + test (redis)
        working-directory: redis
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: vet + test (rate-limiter)
        working-directory: rate-limiter
        run: |
          go vet ./...
          go test -race -count=1 ./...
