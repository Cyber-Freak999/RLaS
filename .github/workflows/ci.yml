# Small PR workflow (AGENTS.md "CI policy"): go vet + go test -race for all
# three modules. The heavy compose + k6 suite stays a local/release gate. The
# job name is deliberately a single "build-and-test" so it maps 1:1 onto the
# required status check wired into the main branch protection rule.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-kick: lets us re-trigger the exact same job on a PR head ref via
  # `gh workflow run ci.yml --ref <branch>` when a run is stuck or lost to a
  # GitHub Actions outage, instead of the close/reopen PR dance.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      # Pinned to full commit SHAs (not floating tags) so the actions can't be
      # silently mutated by a tag move; the build-and-test check must be
      # reproducible on the protected main branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: redis/go.mod
          cache: true
          # Each module has its own go.sum; point the cache at them all or it
          # silently never restores (go.mod/go.sum are not at the repo root).
          cache-dependency-path: |
            redis/go.sum
            rate-limiter/go.sum
            control-plane/go.sum

      - name: vet + test (redis)
        working-directory: redis
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: vet + test (rate-limiter)
        working-directory: rate-limiter
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: vet + test (control-plane)
        working-directory: control-plane
        run: |
          go vet ./...
          go test -race -count=1 ./...
